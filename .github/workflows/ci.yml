name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages (@webcrawl/client, @webcrawl/mcp, webcrawl)
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck

      - name: Run workspace package tests
        run: npm run test:packages

      - name: Run core engine unit tests
        run: npm test
